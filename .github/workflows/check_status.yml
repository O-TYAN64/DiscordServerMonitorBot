name: Check Server Status

on:
  workflow_dispatch:
    inputs:
      server_names:
        description: "カンマ区切りのサーバー識別名 (all で全サーバー)"
        required: true
        default: "all"
      channel_id:
        description: "Discord チャンネルID (参照用)"
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run status checker
        env:
          SERVER_NAMES: ${{ github.event.inputs.server_names }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          GAME_SERVER_API_KEY: ${{ secrets.GAME_SERVER_API_KEY }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          cd src
          python check_status.py